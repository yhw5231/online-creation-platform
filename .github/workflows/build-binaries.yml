name: Build Native Binaries (Windows / macOS / Linux)

# 打 v* 标签（或手动触发）时，交叉编译各平台原生可执行文件并发布到 GitHub Release。
# 用途：在未安装 Docker 的 Windows / macOS / Linux 上直接运行平台。
# 说明：Docker 部署已通过 ghcr.io 镜像覆盖 amd64/arm64（Mac/Windows 的 Docker Desktop
#       运行的是 Linux 容器，自动匹配对应架构）；本工作流提供的是“原生可执行文件”。
#
# 版本发布要求（详见 docs/release.md）：
#   - 发布说明必须用中文并逐条写明本次变动内容，禁止只放自动生成的 "Full Changelog"；
#   - 每次推送到 master，CI 会自动把 VERSION 文件（仓库唯一版本来源）补丁号 +1
#     并回写仓库；本工作流在打 v* 标签时，强校验标签版本号必须与 VERSION 文件
#     一致（否则构建直接失败），确保"发布版本 == 文件内版本号"；
#   - 版本号通过 -X main.AppVersion 注入可执行文件，设置页“关于与更新”据此
#     在线检测新版本 / 在线更新；
#   - 提交信息请使用中文，便于自动汇总生成发布说明。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows
            arch: amd64
            ext: .exe
          - os: windows
            arch: arm64
            ext: .exe
          - os: darwin
            arch: amd64
            ext: ""
          - os: darwin
            arch: arm64
            ext: ""
          - os: linux
            arch: amd64
            ext: ""
          - os: linux
            arch: arm64
            ext: ""
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check version alignment (tag must match VERSION file)
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          # 强制"发布版本 == 文件内版本号"：每次推送到 master 都会自动把
          # VERSION 补丁号 +1，因此发布即打当前 VERSION 对应的标签即可。
          # 手动触发（workflow_dispatch）不受此约束，版本号同样取自 VERSION 文件。
          FILE_VER="v$(cat VERSION)"
          if [ "${GITHUB_REF_NAME}" != "${FILE_VER}" ]; then
            echo "::error::发布标签 ${GITHUB_REF_NAME} 与仓库文件内版本号 ${FILE_VER} 不一致。请先推送到 master 让 CI 自动升级版本号，然后改打标签 ${FILE_VER} 再触发发布。"
            exit 1
          fi

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.21"
          cache: true

      - name: Build
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist/package
          # 版本号统一取自 VERSION 文件（标签触发时已由上方校验与标签一致），
          # 供设置页“关于与更新”显示与在线更新比较
          APP_VER="v$(cat VERSION)"
          go build -trimpath -ldflags "-s -w -X main.AppVersion=${APP_VER}" -o dist/package/app${{ matrix.ext }} .
          cp -r templates static dist/package/

      - name: Package
        run: |
          cd dist
          if [ "${{ matrix.os }}" = "windows" ]; then
            (cd package && zip -r ../online-creation-${{ matrix.os }}-${{ matrix.arch }}.zip .)
          else
            tar -czf online-creation-${{ matrix.os }}-${{ matrix.arch }}.tar.gz -C package .
          fi
          ls -lh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: online-creation-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/online-creation-${{ matrix.os }}-${{ matrix.arch }}.*
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate Chinese release notes
        run: |
          # 详细中文发布说明：列出自上一个标签以来的全部提交。
          # 提交信息本身使用中文（仓库约定，见 docs/release.md），
          # 因此汇总即为逐条变动内容，禁止只发布 "Full Changelog"。
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)
          NOTESTMP=$(mktemp)
          {
            echo "## ${GITHUB_REF_NAME} 更新内容"
            echo ""
            if [ -n "$PREV_TAG" ]; then
              echo "自 ${PREV_TAG} 以来的变动："
              echo ""
              git log --oneline --no-merges "${PREV_TAG}"..HEAD | sed 's/^/- /'
            else
              echo "首次发布，全部提交："
              echo ""
              git log --oneline --no-merges | sed 's/^/- /'
            fi
            echo ""
            echo "> 下载对应平台的压缩包解压后运行 app（Windows 为 app.exe），数据保存在 data/ 目录。"
            echo "> Docker 部署请使用 ghcr.io 镜像：docker compose pull && docker compose up -d"
          } > "$NOTESTMP"
          cp "$NOTESTMP" dist/RELEASE_NOTES.md
          echo "NOTES_FILE=$NOTESTMP" >> "$GITHUB_ENV"

      - name: Publish to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          ls -lh
          # 首次发布：创建 Release 并上传附件与中文发布说明；
          # 标题固定为版本号（如 v1.2.0），改动详情写在发布说明正文；
          # tag 已存在（重跑）时改为只上传附件
          gh release create "${GITHUB_REF_NAME}" ./* \
            --repo "${{ github.repository }}" \
            --title "${GITHUB_REF_NAME}" \
            --notes-file "${NOTES_FILE}" \
            || gh release upload "${GITHUB_REF_NAME}" ./* --repo "${{ github.repository }}"