{{define "content-login"}}
<div class="auth-split card app-card fade-in-up overflow-hidden border-0">
    <div class="auth-split-brand">
        <div class="auth-logo-lg">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19l7-7 3 3-7 7-3-3z"/><path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"/><path d="M2 2l7.586 7.586"/><circle cx="11" cy="11" r="2"/></svg>
        </div>
        <h2>欢迎回来</h2>
        <p>登录后继续你的 AI 创作之旅</p>
        <ul class="auth-features">
            <li><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6L9 17l-5-5"/></svg>多模型 AI 图片创作</li>
            <li><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6L9 17l-5-5"/></svg>每日签到免费领积分</li>
            <li><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6L9 17l-5-5"/></svg>创作记录云端存档</li>
        </ul>
    </div>
    <div class="auth-split-form">
        {{if .Error}}<div class="alert alert-danger dismissible-auto" role="alert">{{.Error}}</div>{{end}}
        <h5 class="fw-bold mb-1">账号登录</h5>
        <p class="text-muted small mb-4">使用注册时的用户名和密码登录</p>
        <form method="POST" action="/login" data-submit="loading" novalidate>
            <input type="hidden" name="_csrf" value="{{.CSRF}}">
            {{if .Next}}<input type="hidden" name="next" value="{{.Next}}">{{end}}
            <div class="mb-3">
                <label class="form-label fw-semibold">用户名</label>
                <input type="text" name="username" class="form-control" placeholder="请输入用户名" required autofocus autocomplete="username" value="{{.LastUsername}}">
            </div>
            <div class="mb-3">
                <label class="form-label fw-semibold">密码</label>
                <div class="input-group">
                    <input type="password" name="password" id="loginPassword" class="form-control" placeholder="请输入密码" required autocomplete="current-password">
                    <button type="button" class="btn btn-outline-secondary pwd-toggle" data-target="loginPassword" tabindex="-1">显示</button>
                </div>
            </div>
            <button type="submit" class="btn btn-primary w-100 btn-loading" data-loading-text="登录中...">
                <span>登 录</span>
            </button>
        </form>
        <div class="text-center mt-3">
            <span class="text-muted">还没有账号？</span>
            <a href="/register" class="fw-semibold text-primary">立即注册</a>
            <span class="mx-2 text-muted">·</span>
            <span class="text-muted small">忘记密码？请联系管理员重置</span>
        </div>
        {{if .OAuthEnabled}}
        <div class="divider mt-4"><span>或者</span></div>
        <a href="/auth/linuxdo{{if .Next}}?next={{.Next}}{{end}}" class="btn btn-outline-secondary w-100 mt-3 rounded-3">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" class="me-2" aria-hidden="true"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z"/></svg>
            使用 Linux.do 登录
        </a>
        {{end}}
    </div>
</div>
{{end}}
