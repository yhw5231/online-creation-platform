{{define "content-password"}}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="card app-card fade-in-up">
            <div class="card-header py-3 px-4">
                <h5 class="mb-0 fw-bold">修改密码</h5>
            </div>
            <div class="card-body p-4">
                {{if .Error}}<div class="alert alert-danger dismissible-auto" role="alert">{{.Error}}</div>{{end}}
                {{if .Success}}<div class="alert alert-success dismissible-auto" role="alert">{{.Success}}</div>{{end}}
                <form method="POST" action="/password" data-submit="loading" novalidate>
                    <input type="hidden" name="_csrf" value="{{.CSRF}}">
                    <div class="mb-3">
                        <label class="form-label fw-semibold">原密码</label>
                        <div class="input-group">
                            <input type="password" name="old_password" id="oldPassword" class="form-control" placeholder="请输入当前使用的密码" required autocomplete="current-password">
                            <button type="button" class="btn btn-outline-secondary pwd-toggle" data-target="oldPassword" tabindex="-1">显示</button>
                        </div>
                    </div>
                    <div class="mb-4">
                        <label class="form-label fw-semibold">新密码</label>
                        <div class="input-group">
                            <input type="password" name="new_password" id="newPassword" class="form-control" minlength="6" placeholder="至少 6 位字符" required autocomplete="new-password" data-meter>
                            <button type="button" class="btn btn-outline-secondary pwd-toggle" data-target="newPassword" tabindex="-1">显示</button>
                        </div>
                        <div class="pw-meter mt-2" hidden>
                            <div class="pw-meter-bar"><i class="pw-meter-fill"></i></div>
                            <div class="pw-meter-text small"></div>
                        </div>
                        <div class="form-text">修改后需使用新密码重新登录。</div>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 btn-loading" data-loading-text="保存中...">
                        <span>确认修改</span>
                    </button>
                </form>
                <div class="text-center mt-3">
                    <a href="/points" class="text-muted small">查看积分明细</a>
                </div>
                <div class="text-center mt-2">
                    <a href="/rules" class="text-muted small">忘记原密码？请联系管理员协助找回</a>
                </div>
            </div>
        </div>
    </div>
</div>
{{end}}
