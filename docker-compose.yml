version: '3'
services:
  app:
    build: .
    ports:
      - "8900:8900"
    volumes:
      - ./data:/app/data
      - ./static:/app/static
    environment:
      - TZ=Asia/Shanghai
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8900/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped